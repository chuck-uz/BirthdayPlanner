server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # /api is routed by DockHost to the backend service.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
